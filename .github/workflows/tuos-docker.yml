# tuos's container image (FORK.md, "Hosted by this fork"), built from the Dockerfile on GitHub's own
# runners and published to ghcr.io/<owner>/tuos for amd64 and arm64:
#
#   a push to main         -> :main and :latest (the same image), :main-desktop and :latest-desktop
#   a release tag vX.Y.Z   -> :vX.Y.Z and :vX.Y.Z-desktop
#
# `latest` follows main, as installs from this repository do (FORK.md), so the docs' untagged
# `docker run ghcr.io/sreent/tuos` works from the first merge.
# The -desktop variant adds the packages the bots' screens need (HERMES_BOT_DESKTOP=1). A pull request
# that touches the image builds and smoke-tests it without publishing anything.
name: tuos Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/tuos-docker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tuos-docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build ${{ matrix.variant }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        variant: [slim, desktop]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      PUBLISH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the install stamp's version counts commits since the last release tag
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      # The image has no .git, so this stamp is how it knows its commit and version.
      - name: Write the install stamp
        run: |
          set -euo pipefail
          display="$(python3 -m scripts.releases.distance)"
          identity=(--commit "$GITHUB_SHA")
          if [ -n "$display" ]; then
            base="${display%%+*}"
            development="${display#*+}"
            if [ "$development" = "$display" ]; then distance=0; else distance="${development%%.*}"; fi
            identity+=(--base-version "$base" --display-version "$display" --distance "$distance")
          fi
          python3 scripts/write_install_stamp.py --output install-stamp.json \
            --distribution docker --update-mechanism external --source ci "${identity[@]}"

      - name: Reject profile exports in the build context
        run: python3 scripts/ci/check_profile_archive_boundary.py

      - name: Name the image
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tuos" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # Slim owns the layer cache; desktop only adds packages on top, so it reads slim's.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: HERMES_BOT_DESKTOP=${{ matrix.variant == 'desktop' && '1' || '0' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          load: true
          tags: tuos:test
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: ${{ (env.PUBLISH == 'true' && matrix.variant == 'slim') && format('type=gha,mode=max,scope=docker-{0}', matrix.arch) || '' }}

      - name: Smoke-test the image
        run: docker run --rm tuos:test --version

      - name: Log in to GitHub's container registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed untagged; the publish job tags both architectures together. The layers come from the
      # build above, so this only uploads.
      - name: Push by digest
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: HERMES_BOT_DESKTOP=${{ matrix.variant == 'desktop' && '1' || '0' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=docker-${{ matrix.arch }}

      - name: Record the digest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: digest-${{ matrix.variant }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Tag ${{ matrix.variant }}
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - variant: slim
            suffix: ""
          - variant: desktop
            suffix: "-desktop"
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-${{ matrix.variant }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag both architectures as one image
        working-directory: ${{ runner.temp }}/digests
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tuos"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tags=(-t "$image:${GITHUB_REF_NAME}${SUFFIX}")
          else
            tags=(-t "$image:main${SUFFIX}" -t "$image:latest${SUFFIX}")
          fi
          sources=()
          for digest in *; do sources+=("$image@sha256:$digest"); done
          if [ "${#sources[@]}" -ne 2 ]; then echo "::error::expected two digests, got ${#sources[@]}"; exit 1; fi
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "${tags[1]}"
