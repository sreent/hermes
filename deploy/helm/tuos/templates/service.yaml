# The StatefulSet's governing Service: gives the pod its DNS name, exposes nothing.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tuos.fullname" . }}
  labels:
    {{- include "tuos.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "tuos.selectorLabels" . | nindent 4 }}
{{- if and .Values.dashboard.enabled .Values.dashboard.expose }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tuos.fullname" . }}-dashboard
  labels:
    {{- include "tuos.labels" . | nindent 4 }}
  {{- with .Values.dashboard.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.dashboard.service.type }}
  selector:
    {{- include "tuos.selectorLabels" . | nindent 4 }}
  ports:
    - name: dashboard
      port: {{ .Values.dashboard.service.port }}
      targetPort: dashboard
      protocol: TCP
{{- end }}
