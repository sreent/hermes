{{- if and .Values.secrets.env (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tuos.fullname" . }}
  labels:
    {{- include "tuos.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $name, $value := .Values.secrets.env }}
  {{ $name }}: {{ $value | toString | b64enc | quote }}
  {{- end }}
{{- end }}
